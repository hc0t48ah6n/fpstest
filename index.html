<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="xSMe8NjOJitIbihp_Rs4ctuOhG8ogC3gYNH4PRTPxKA" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Stage Physics & 3D Benchmark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Cannon.js for Physics Simulation Benchmark -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .glass-badge {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen relative">

    <!-- 左上固定: 常時FPS ＆ オブジェクト/アイテム数 ＆ ネットPing表示 -->
    <div class="fixed top-3 left-3 z-50 flex items-center gap-2.5 px-3.5 py-2 rounded-2xl glass-badge shadow-xl">
        <div class="relative flex h-3 w-3">
            <span id="fps-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span id="fps-dot" class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </div>
        <div class="flex flex-col">
            <span class="text-[10px] font-bold text-slate-400 leading-none">FPS</span>
            <span id="fps-text" class="text-2xl font-black font-mono text-emerald-400 leading-none mt-0.5">60</span>
        </div>
        <div class="h-6 w-px bg-slate-700/80 mx-1"></div>
        <div class="flex flex-col">
            <span id="metric-label" class="text-[10px] font-bold text-slate-400 leading-none">OBJECTS</span>
            <span id="count-text" class="text-lg font-bold font-mono text-sky-400 leading-none mt-0.5">0</span>
        </div>
        <div class="h-6 w-px bg-slate-700/80 mx-1"></div>
        <div class="flex flex-col">
            <span class="text-[10px] font-bold text-slate-400 leading-none">PING</span>
            <span id="ping-text" class="text-lg font-bold font-mono text-amber-400 leading-none mt-0.5">-- ms</span>
        </div>
    </div>

    <!-- テスト進行状態インジケーター（中央上部） -->
    <div id="test-banner" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 px-4 py-1.5 rounded-full glass-badge hidden border border-indigo-500/30 text-center">
        <span id="test-step-name" class="text-xs font-bold text-indigo-300">テスト 1/7: 3Dモデル負荷</span>
    </div>

    <!-- 大量テキストスクロールテスト用オーバーレイ -->
    <div id="text-scroll-container" class="fixed inset-0 z-30 overflow-y-auto hidden bg-slate-950/90 text-slate-300 p-6 font-mono text-xs leading-relaxed pointer-events-auto">
        <div id="text-scroll-content" class="max-w-xl mx-auto space-y-4"></div>
    </div>

    <!-- WebGL & Canvas Container -->
    <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

    <!-- 下部操作エリア -->
    <div class="fixed bottom-6 left-0 right-0 z-40 px-4 flex flex-col items-center justify-center pointer-events-none">
        <button id="btn-start" class="pointer-events-auto w-full max-w-xs py-4 px-6 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-95 text-white font-bold text-lg shadow-2xl flex items-center justify-center gap-3 transition-all">
            <i id="btn-icon" class="fa-solid fa-play text-xl"></i>
            <span id="btn-label">ベンチマーク開始</span>
        </button>

        <p id="status-hint" class="text-xs text-slate-400 mt-2 font-medium bg-slate-900/60 px-3 py-1 rounded-full glass-badge pointer-events-none text-center">
            全7ステージの自動負荷テスト（10FPS低下まで測定）
        </p>
    </div>

    <!-- 計測完了・総合スコア ダイアログ -->
    <div id="result-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md hidden transition-opacity duration-300 overflow-y-auto">
        <div class="w-full max-w-sm glass-card rounded-3xl p-6 shadow-2xl text-center space-y-4 border border-indigo-500/40 my-auto">
            <div class="w-14 h-14 bg-gradient-to-tr from-amber-500 to-yellow-300 rounded-2xl flex items-center justify-center mx-auto text-slate-950 text-2xl font-black shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-trophy"></i>
            </div>
            
            <div>
                <h2 class="text-2xl font-black text-white tracking-wide">スコア結果</h2>
                <p class="text-xs text-slate-400 mt-0.5">総合パフォーマンススコア</p>
                <div class="mt-2 text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-400 to-yellow-500 font-mono" id="final-score">
                    0
                </div>
            </div>

            <!-- 各テスト結果ブレイクダウン -->
            <div class="bg-slate-900/90 rounded-2xl p-3.5 border border-slate-800 space-y-2 text-left text-xs">
                <!-- 1. 3Dオブジェクト生成 -->
                <div class="flex items-center justify-between">
                    <span class="text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-cube text-indigo-400"></i> 3Dモデル (10FPS限界)
                    </span>
                    <span id="res-3d-count" class="font-bold text-indigo-300 font-mono">0 個</span>
                </div>

                <!-- 2. Cannon.js 剛体物理演算 -->
                <div class="flex items-center justify-between border-t border-slate-800/80 pt-1.5">
                    <span class="text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-cubes-stacked text-amber-400"></i> Cannon.js 剛体物理
                    </span>
                    <span id="res-cannon-count" class="font-bold text-amber-300 font-mono">0 個</span>
                </div>

                <!-- 2.5 リアル水面＆水しぶき物理 -->
                <div class="flex items-center justify-between border-t border-slate-800/80 pt-1.5">
                    <span class="text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-water text-cyan-400"></i> 水面反射＆水しぶき物理
                    </span>
                    <span id="res-water-count" class="font-bold text-cyan-300 font-mono">0 落下</span>
                </div>

                <!-- 3. テクスチャ画像読み込み＆合成 -->
                <div class="flex items-center justify-between border-t border-slate-800/80 pt-1.5">
                    <span class="text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-image text-emerald-400"></i> 画像＆テクスチャ処理
                    </span>
                    <span id="res-img-count" class="font-bold text-emerald-300 font-mono">0 枚</span>
                </div>

                <!-- 4. CPU演算・粒子物理計算 -->
                <div class="flex items-center justify-between border-t border-slate-800/80 pt-1.5">
                    <span class="text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-microchip text-sky-400"></i> CPU粒子物理計算
                    </span>
                    <span id="res-cpu-count" class="font-bold text-sky-300 font-mono">0 粒子</span>
                </div>

                <!-- 5. テキストスクロールテスト -->
                <div class="flex items-center justify-between border-t border-slate-800/80 pt-1.5">
                    <span class="text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-file-lines text-pink-400"></i> テキストスクロール (10秒)
                    </span>
                    <span id="res-scroll-fps" class="font-bold text-pink-300 font-mono">0 FPS (最低)</span>
                </div>

                <!-- 6. CPU非同期無限タスク予約＆計算テスト -->
                <div class="flex items-center justify-between border-t border-slate-800/80 pt-1.5">
                    <span class="text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-bolt text-purple-400"></i> CPUタスク予約＆行列計算
                    </span>
                    <span id="res-cpu-task-count" class="font-bold text-purple-300 font-mono">0 万回</span>
                </div>

                <!-- Ping応答速度 -->
                <div class="flex items-center justify-between border-t border-slate-800/80 pt-1.5">
                    <span class="text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-wifi text-amber-400"></i> ネットワーク Ping
                    </span>
                    <span id="res-ping" class="font-bold text-amber-300 font-mono">-- ms</span>
                </div>
            </div>

            <button id="btn-restart" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-95 text-white font-bold rounded-2xl shadow-xl transition">
                もう一度計測する
            </button>
        </div>
    </div>

    <script>
        window.onload = function() {
            let scene, camera, renderer;
            let objects = [];
            let particleGeom, particleMesh;
            let particlePositions, particleVelocities;

            // Cannon.js physics variables
            let world;
            let physicsBodies = [];
            let physicsMeshes = [];

            // Water simulation variables
            let waterMesh = null;
            let waterGeometry = null;
            let waterHeights = null;
            let waterVelocities = null;
            let splashParticles = [];
            let waterCubeCamera = null;
            let renderTarget = null;
            let waterDroppedCount = 0;

            let isTesting = false;
            let currentTestStep = 0; // 0: Idle, 1: 3D, 2: Rigid Physics, 3: Water Physics, 4: Textures, 5: CPU Particles, 6: Text Scroll, 7: CPU Task
            let spawnTimer = null;
            let scrollTimer = null;

            // CPU Task Bombardment variables
            let taskChannel = null;
            let totalCpuComputations = 0;
            let isCpuBombingActive = false;

            // Performance metrics
            let frameCount = 0;
            let lastTime = performance.now();
            let currentFps = 60;

            // Network Ping metrics
            let currentPing = -1;
            let pingInterval = null;

            // Step metrics
            let result3DObjects = 0;
            let resultCannonObjects = 0;
            let resultWaterDrops = 0;
            let resultImageTextures = 0;
            let resultCPUParticles = 0;
            let resultScrollMinFps = 60;
            let resultCpuTaskComputations = 0;
            let scrollStepStartTime = 0;

            // DOM Elements
            const fpsText = document.getElementById('fps-text');
            const countText = document.getElementById('count-text');
            const pingText = document.getElementById('ping-text');
            const metricLabel = document.getElementById('metric-label');
            const fpsDot = document.getElementById('fps-dot');
            const fpsPing = document.getElementById('fps-ping');
            const btnStart = document.getElementById('btn-start');
            const btnIcon = document.getElementById('btn-icon');
            const btnLabel = document.getElementById('btn-label');
            const statusHint = document.getElementById('status-hint');
            const testBanner = document.getElementById('test-banner');
            const testStepName = document.getElementById('test-step-name');
            const resultModal = document.getElementById('result-modal');
            const res3dCount = document.getElementById('res-3d-count');
            const resCannonCount = document.getElementById('res-cannon-count');
            const resWaterCount = document.getElementById('res-water-count');
            const resImgCount = document.getElementById('res-img-count');
            const resCpuCount = document.getElementById('res-cpu-count');
            const resScrollFps = document.getElementById('res-scroll-fps');
            const resCpuTaskCount = document.getElementById('res-cpu-task-count');
            const resPing = document.getElementById('res-ping');
            const finalScore = document.getElementById('final-score');
            const btnRestart = document.getElementById('btn-restart');
            const container = document.getElementById('canvas-container');
            const textScrollContainer = document.getElementById('text-scroll-container');
            const textScrollContent = document.getElementById('text-scroll-content');

            // Ping measurement function
            async function measurePing() {
                const startTime = performance.now();
                try {
                    await fetch('https://ajax.googleapis.com/ajax/libs/threejs/r128/three.min.js?t=' + Date.now(), {
                        method: 'HEAD',
                        mode: 'no-cors',
                        cache: 'no-cache'
                    });
                    const duration = Math.round(performance.now() - startTime);
                    currentPing = duration;
                    pingText.textContent = `${duration} ms`;
                } catch (e) {
                    pingText.textContent = `Err`;
                }
            }

            measurePing();
            pingInterval = setInterval(measurePing, 2000);

            // Shared geometries & textures
            const baseSphereGeom = new THREE.SphereGeometry(0.7, 16, 16);
            const boxGeom = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const generatedTextures = [];

            function createProceduralTexture(index) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = `hsl(${(index * 35) % 360}, 80%, 50%)`;
                ctx.fillRect(0, 0, 256, 256);
                for (let i = 0; i < 40; i++) {
                    ctx.fillStyle = `rgba(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255}, 0.5)`;
                    ctx.beginPath();
                    ctx.arc(Math.random()*256, Math.random()*256, Math.random()*40, 0, Math.PI * 2);
                    ctx.fill();
                }

                return new THREE.CanvasTexture(canvas);
            }

            for(let i = 0; i < 10; i++) {
                generatedTextures.push(createProceduralTexture(i));
            }

            function initPhysics() {
                world = new CANNON.World();
                world.gravity.set(0, -9.82, 0);
                world.broadphase = new CANNON.NaiveBroadphase();
                world.solver.iterations = 5;

                const groundShape = new CANNON.Plane();
                const groundBody = new CANNON.Body({ mass: 0 });
                groundBody.addShape(groundShape);
                groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
                groundBody.position.set(0, -10, 0);
                world.addBody(groundBody);
            }

            function initThree() {
                scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x020617, 0.02);

                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 12, 28);
                camera.lookAt(0, 0, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
                dirLight.position.set(10, 20, 10);
                scene.add(dirLight);

                // Sky background elements for realistic reflection
                const envGeom = new THREE.BoxGeometry(100, 100, 100);
                const envMats = [
                    new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.BackSide }),
                    new THREE.MeshBasicMaterial({ color: 0x0284c7, side: THREE.BackSide }),
                    new THREE.MeshBasicMaterial({ color: 0x0369a1, side: THREE.BackSide }),
                    new THREE.MeshBasicMaterial({ color: 0x020617, side: THREE.BackSide }),
                    new THREE.MeshBasicMaterial({ color: 0x818cf8, side: THREE.BackSide }),
                    new THREE.MeshBasicMaterial({ color: 0xc084fc, side: THREE.BackSide })
                ];
                const envBox = new THREE.Mesh(envGeom, envMats);
                scene.add(envBox);

                // Environment Cube Camera for water surface reflection
                renderTarget = new THREE.WebGLCubeRenderTarget(256, {
                    generateMipmaps: true,
                    minFilter: THREE.LinearMipmapLinearFilter
                });
                waterCubeCamera = new THREE.CubeCamera(0.1, 1000, renderTarget);

                window.addEventListener('resize', onWindowResize);
                initPhysics();
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function startTestSequence() {
                clearAll();
                
                frameCount = 0;
                lastTime = performance.now();
                currentFps = 60;
                fpsText.textContent = "60";

                isTesting = true;
                currentTestStep = 1;
                
                btnStart.className = "pointer-events-auto w-full max-w-xs py-4 px-6 rounded-2xl bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-bold text-lg shadow-2xl flex items-center justify-center gap-3 transition-all";
                btnIcon.className = "fa-solid fa-stop text-xl";
                btnLabel.textContent = "テスト中止";
                statusHint.textContent = "自動計測中...";
                testBanner.classList.remove('hidden');

                runStep1();
            }

            function nextStep() {
                if (spawnTimer) clearInterval(spawnTimer);
                if (scrollTimer) clearInterval(scrollTimer);
                clearAll();

                currentTestStep++;
                if (currentTestStep === 2) {
                    runStep2();
                } else if (currentTestStep === 3) {
                    runStep3();
                } else if (currentTestStep === 4) {
                    runStep4();
                } else if (currentTestStep === 5) {
                    runStep5();
                } else if (currentTestStep === 6) {
                    runStep6();
                } else if (currentTestStep === 7) {
                    runStep7();
                } else {
                    finishBenchmark();
                }
            }

            function clearAll() {
                if (spawnTimer) clearInterval(spawnTimer);
                if (scrollTimer) clearInterval(scrollTimer);
                
                isCpuBombingActive = false;
                if (taskChannel) {
                    taskChannel.port1.close();
                    taskChannel.port2.close();
                    taskChannel = null;
                }

                textScrollContainer.classList.add('hidden');
                textScrollContent.innerHTML = '';

                // Clear THREE meshes
                objects.forEach(obj => {
                    scene.remove(obj);
                    if (obj.material) {
                        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                        else obj.material.dispose();
                    }
                });
                objects = [];

                // Clear Cannon physics
                physicsBodies.forEach(body => world.remove(body));
                physicsMeshes.forEach(mesh => scene.remove(mesh));
                physicsBodies = [];
                physicsMeshes = [];

                // Clear Water mesh and splash particles
                if (waterMesh) {
                    scene.remove(waterMesh);
                    waterGeometry.dispose();
                    waterMesh.material.dispose();
                    waterMesh = null;
                }
                splashParticles.forEach(p => scene.remove(p.mesh));
                splashParticles = [];

                if (particleMesh) {
                    scene.remove(particleMesh);
                    particleGeom.dispose();
                    particleMesh = null;
                }
                countText.textContent = "0";
            }

            function runStep1() {
                testStepName.textContent = "テスト 1/7: 3Dモデル負荷";
                metricLabel.textContent = "3D MESHES";

                spawnTimer = setInterval(() => {
                    if (!isTesting) return;
                    const amount = objects.length > 3000 ? 250 : (objects.length > 1000 ? 100 : 25);
                    for (let i = 0; i < amount; i++) {
                        const mat = new THREE.MeshStandardMaterial({
                            color: Math.random() * 0xffffff,
                            roughness: 0.3
                        });
                        const mesh = new THREE.Mesh(baseSphereGeom, mat);
                        const range = 35;
                        mesh.position.set(
                            (Math.random() - 0.5) * range,
                            (Math.random() - 0.5) * range,
                            (Math.random() - 0.5) * range
                        );
                        mesh.userData = { rotX: (Math.random() - 0.5) * 0.05, rotY: (Math.random() - 0.5) * 0.05 };
                        scene.add(mesh);
                        objects.push(mesh);
                    }
                    countText.textContent = objects.length.toLocaleString();
                }, 50);
            }

            function runStep2() {
                testStepName.textContent = "テスト 2/7: Cannon.js 剛体物理";
                metricLabel.textContent = "BODIES";

                const pMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 });
                const shape = new CANNON.Box(new CANNON.Vec3(0.6, 0.6, 0.6));

                spawnTimer = setInterval(() => {
                    if (!isTesting) return;
                    const amount = physicsBodies.length > 1000 ? 50 : 10;
                    for (let i = 0; i < amount; i++) {
                        const body = new CANNON.Body({ mass: 1 });
                        body.addShape(shape);
                        body.position.set(
                            (Math.random() - 0.5) * 15,
                            15 + Math.random() * 20,
                            (Math.random() - 0.5) * 15
                        );
                        world.addBody(body);
                        physicsBodies.push(body);

                        const mesh = new THREE.Mesh(boxGeom, pMat);
                        scene.add(mesh);
                        physicsMeshes.push(mesh);
                    }
                    countText.textContent = physicsBodies.length.toLocaleString();
                }, 50);
            }

            function runStep3() {
                testStepName.textContent = "テスト 3/7: 水面反射＆リアル水しぶき物理";
                metricLabel.textContent = "DROPS";
                waterDroppedCount = 0;

                // Create high-density grid for dynamic height-field ripple simulation
                const size = 30;
                const segments = 60;
                waterGeometry = new THREE.PlaneGeometry(size, size, segments, segments);
                waterGeometry.rotateX(-Math.PI / 2);

                const vertCount = waterGeometry.attributes.position.count;
                waterHeights = new Float32Array(vertCount);
                waterVelocities = new Float32Array(vertCount);

                const waterMat = new THREE.MeshPhysicalMaterial({
                    color: 0x0066aa,
                    transmission: 0.6,
                    opacity: 0.92,
                    transparent: true,
                    roughness: 0.05,
                    metalness: 0.1,
                    ior: 1.333,
                    envMap: renderTarget.texture,
                    reflectivity: 0.9,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.1
                });

                waterMesh = new THREE.Mesh(waterGeometry, waterMat);
                waterMesh.position.y = -2;
                scene.add(waterMesh);

                const dropGeom = new THREE.SphereGeometry(0.8, 12, 12);
                const dropMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.5 });

                spawnTimer = setInterval(() => {
                    if (!isTesting) return;

                    const spawnBatch = waterDroppedCount > 500 ? 25 : (waterDroppedCount > 100 ? 10 : 3);
                    for (let k = 0; k < spawnBatch; k++) {
                        const dropMesh = new THREE.Mesh(dropGeom, dropMat);
                        const spawnX = (Math.random() - 0.5) * 22;
                        const spawnZ = (Math.random() - 0.5) * 22;
                        dropMesh.position.set(spawnX, 15 + Math.random() * 8, spawnZ);
                        dropMesh.userData = {
                            vy: -0.4 - Math.random() * 0.3,
                            splashed: false
                        };
                        scene.add(dropMesh);
                        objects.push(dropMesh);
                        waterDroppedCount++;
                    }
                    countText.textContent = waterDroppedCount.toLocaleString();
                }, 50);
            }

            function createSplash(x, z) {
                const splashGeom = new THREE.SphereGeometry(0.12, 8, 8);
                const splashMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.9 });
                const count = 28;

                for (let i = 0; i < count; i++) {
                    const mesh = new THREE.Mesh(splashGeom, splashMat);
                    mesh.position.set(x, -1.8, z);
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 0.15 + Math.random() * 0.35;
                    const vy = 0.3 + Math.random() * 0.5;

                    scene.add(mesh);
                    splashParticles.push({
                        mesh: mesh,
                        vx: Math.cos(angle) * speed,
                        vy: vy,
                        vz: Math.sin(angle) * speed,
                        life: 1.0
                    });
                }

                // Trigger wave height disturbance on water surface
                const pos = waterGeometry.attributes.position.array;
                const gridDim = 61;
                const worldStep = 30 / 60;

                const gx = Math.floor((x + 15) / worldStep);
                const gz = Math.floor((z + 15) / worldStep);

                for (let dx = -3; dx <= 3; dx++) {
                    for (let dz = -3; dz <= 3; dz++) {
                        const nx = gx + dx;
                        const nz = gz + dz;
                        if (nx >= 0 && nx < gridDim && nz >= 0 && nz < gridDim) {
                            const idx = nz * gridDim + nx;
                            const dist = Math.sqrt(dx * dx + dz * dz);
                            if (dist < 3.5) {
                                waterVelocities[idx] -= (3.5 - dist) * 0.35;
                            }
                        }
                    }
                }
            }

            function runStep4() {
                testStepName.textContent = "テスト 4/7: 画像＆テクスチャ処理";
                metricLabel.textContent = "TEXTURES";

                spawnTimer = setInterval(() => {
                    if (!isTesting) return;
                    const amount = objects.length > 2000 ? 100 : 20;
                    for (let i = 0; i < amount; i++) {
                        const tex = generatedTextures[Math.floor(Math.random() * generatedTextures.length)];
                        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.85 });
                        const mesh = new THREE.Mesh(baseSphereGeom, mat);
                        const range = 30;
                        mesh.position.set(
                            (Math.random() - 0.5) * range,
                            (Math.random() - 0.5) * range,
                            (Math.random() - 0.5) * range
                        );
                        mesh.userData = { rotX: (Math.random() - 0.5) * 0.08, rotY: (Math.random() - 0.5) * 0.08 };
                        scene.add(mesh);
                        objects.push(mesh);
                    }
                    countText.textContent = objects.length.toLocaleString();
                }, 50);
            }

            function runStep5() {
                testStepName.textContent = "テスト 5/7: CPU粒子物理演算";
                metricLabel.textContent = "PARTICLES";

                let particleCapacity = 50000;
                particleGeom = new THREE.BufferGeometry();
                particlePositions = new Float32Array(particleCapacity * 3);
                particleVelocities = new Float32Array(particleCapacity * 3);

                particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
                particleGeom.setDrawRange(0, 0);

                const pMat = new THREE.PointsMaterial({ size: 0.3, color: 0x38bdf8 });
                particleMesh = new THREE.Points(particleGeom, pMat);
                scene.add(particleMesh);

                let currentCount = 0;
                spawnTimer = setInterval(() => {
                    if (!isTesting) return;

                    const addAmount = currentCount > 100000 ? 20000 : (currentCount > 20000 ? 5000 : 1000);
                    const targetCount = currentCount + addAmount;

                    if (targetCount > particleCapacity) {
                        const newCapacity = Math.max(particleCapacity * 2, targetCount + 50000);
                        const newPos = new Float32Array(newCapacity * 3);
                        const newVel = new Float32Array(newCapacity * 3);

                        newPos.set(particlePositions);
                        newVel.set(particleVelocities);

                        particlePositions = newPos;
                        particleVelocities = newVel;
                        particleCapacity = newCapacity;

                        particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
                    }

                    for (let i = currentCount; i < targetCount; i++) {
                        particlePositions[i * 3] = (Math.random() - 0.5) * 40;
                        particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 40;
                        particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 40;

                        particleVelocities[i * 3] = (Math.random() - 0.5) * 0.2;
                        particleVelocities[i * 3 + 1] = (Math.random() - 0.5) * 0.2;
                        particleVelocities[i * 3 + 2] = (Math.random() - 0.5) * 0.2;
                    }

                    currentCount = targetCount;
                    particleGeom.setDrawRange(0, currentCount);
                    countText.textContent = currentCount.toLocaleString();
                }, 50);
            }

            function runStep6() {
                testStepName.textContent = "テスト 6/7: 大量テキスト自動スクロール";
                metricLabel.textContent = "SEC LEFT";
                
                resultScrollMinFps = 60;
                scrollStepStartTime = performance.now();

                textScrollContainer.classList.remove('hidden');

                const dummySample = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.";
                let html = '';
                for (let i = 0; i < 300; i++) {
                    html += `<div class="p-3 bg-slate-900/80 rounded-xl border border-slate-800 shadow-md">
                        <span class="text-indigo-400 font-bold">PARAGRAPH #${i+1}</span>
                        <p class="mt-1">${dummySample}</p>
                    </div>`;
                }
                textScrollContent.innerHTML = html;

                scrollTimer = setInterval(() => {
                    if (!isTesting) return;
                    
                    const elapsed = (performance.now() - scrollStepStartTime) / 1000;
                    const remainingSec = Math.max(0, Math.ceil(10 - elapsed));
                    countText.textContent = `${remainingSec}s`;

                    textScrollContainer.scrollTop += 60;
                    if (textScrollContainer.scrollTop + textScrollContainer.clientHeight >= textScrollContainer.scrollHeight - 10) {
                        textScrollContainer.scrollTop = 0;
                    }

                    if (elapsed >= 10) {
                        nextStep();
                    }
                }, 16);
            }

            function runStep7() {
                testStepName.textContent = "テスト 7/7: CPU爆撃＆無限タスク予約";
                metricLabel.textContent = "CALCS (万)";

                totalCpuComputations = 0;
                isCpuBombingActive = true;

                taskChannel = new MessageChannel();

                function heavyCpuWork() {
                    let acc = 0;
                    for (let i = 0; i < 10000; i++) {
                        acc += Math.sin(i) * Math.cos(i) * Math.sqrt(i + 1.5) * Math.tan(i % 50 + 1);
                    }
                    totalCpuComputations += 1;
                    return acc;
                }

                taskChannel.port1.onmessage = () => {
                    if (!isCpuBombingActive || !isTesting) return;

                    heavyCpuWork();

                    taskChannel.port2.postMessage(null);
                    taskChannel.port2.postMessage(null);
                };

                for (let k = 0; k < 50; k++) {
                    taskChannel.port2.postMessage(null);
                }

                spawnTimer = setInterval(() => {
                    if (!isTesting) return;
                    countText.textContent = totalCpuComputations.toLocaleString();
                }, 50);
            }

            function stopTest() {
                isTesting = false;
                if (spawnTimer) clearInterval(spawnTimer);
                if (scrollTimer) clearInterval(scrollTimer);

                btnStart.className = "pointer-events-auto w-full max-w-xs py-4 px-6 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-95 text-white font-bold text-lg shadow-2xl flex items-center justify-center gap-3 transition-all";
                btnIcon.className = "fa-solid fa-play text-xl";
                btnLabel.textContent = "ベンチマーク開始";
                statusHint.textContent = "全7ステージの自動負荷テスト";
                testBanner.classList.add('hidden');

                clearAll();
            }

            function finishBenchmark() {
                stopTest();

                const score3D = Math.round(result3DObjects * 1.0);
                const scoreCannon = Math.round(resultCannonObjects * 3.0);
                const scoreWater = Math.round(resultWaterDrops * 2.5);
                const scoreImg = Math.round(resultImageTextures * 1.2);
                const scoreCpu = Math.round(resultCPUParticles / 100);
                const scoreScroll = Math.round(resultScrollMinFps * 50);
                const scoreCpuTask = Math.round(resultCpuTaskComputations * 1.0);

                const totalScore = (score3D + scoreCannon + scoreWater + scoreImg + scoreCpu + scoreScroll + scoreCpuTask).toLocaleString();

                res3dCount.textContent = `${result3DObjects.toLocaleString()} 個`;
                resCannonCount.textContent = `${resultCannonObjects.toLocaleString()} 個`;
                resWaterCount.textContent = `${resultWaterDrops.toLocaleString()} 落下`;
                resImgCount.textContent = `${resultImageTextures.toLocaleString()} 枚`;
                resCpuCount.textContent = `${resultCPUParticles.toLocaleString()} 粒子`;
                resScrollFps.textContent = `${resultScrollMinFps} FPS`;
                resCpuTaskCount.textContent = `${resultCpuTaskComputations.toLocaleString()} 万回`;
                resPing.textContent = currentPing > 0 ? `${currentPing} ms` : '-- ms';
                finalScore.textContent = totalScore;

                resultModal.classList.remove('hidden');
            }

            function animate() {
                requestAnimationFrame(animate);

                frameCount++;
                const now = performance.now();
                const delta = now - lastTime;

                if (delta >= 500) {
                    currentFps = Math.round((frameCount * 1000) / delta);
                    frameCount = 0;
                    lastTime = now;

                    fpsText.textContent = currentFps;

                    if (currentFps >= 50) {
                        fpsText.className = "text-2xl font-black font-mono text-emerald-400 leading-none mt-0.5";
                        fpsDot.className = "relative inline-flex rounded-full h-3 w-3 bg-emerald-500";
                        fpsPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
                    } else if (currentFps >= 25) {
                        fpsText.className = "text-2xl font-black font-mono text-amber-400 leading-none mt-0.5";
                        fpsDot.className = "relative inline-flex rounded-full h-3 w-3 bg-amber-500";
                        fpsPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75";
                    } else {
                        fpsText.className = "text-2xl font-black font-mono text-rose-500 leading-none mt-0.5";
                        fpsDot.className = "relative inline-flex rounded-full h-3 w-3 bg-rose-500";
                        fpsPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-500 opacity-75";
                    }

                    if (isTesting && currentTestStep === 6) {
                        if (currentFps < resultScrollMinFps) {
                            resultScrollMinFps = currentFps;
                        }
                    }

                    // FPS Threshold Detection (Target: ~10 FPS drop)
                    if (isTesting && currentFps <= 11) {
                        if (currentTestStep === 1) {
                            result3DObjects = objects.length;
                            nextStep();
                        } else if (currentTestStep === 2) {
                            resultCannonObjects = physicsBodies.length;
                            nextStep();
                        } else if (currentTestStep === 3) {
                            resultWaterDrops = waterDroppedCount;
                            nextStep();
                        } else if (currentTestStep === 4) {
                            resultImageTextures = objects.length;
                            nextStep();
                        } else if (currentTestStep === 5) {
                            const attr = particleGeom ? particleGeom.drawRange.count : 0;
                            resultCPUParticles = attr;
                            nextStep();
                        } else if (currentTestStep === 7) {
                            resultCpuTaskComputations = totalCpuComputations;
                            nextStep();
                        }
                    }
                }

                // Step-specific updates
                if (currentTestStep === 1 || currentTestStep === 4) {
                    for (let i = 0; i < objects.length; i++) {
                        const obj = objects[i];
                        obj.rotation.x += obj.userData.rotX;
                        obj.rotation.y += obj.userData.rotY;
                    }
                } else if (currentTestStep === 2) {
                    world.step(1 / 60);
                    for (let i = 0; i < physicsBodies.length; i++) {
                        physicsMeshes[i].position.copy(physicsBodies[i].position);
                        physicsMeshes[i].quaternion.copy(physicsBodies[i].quaternion);
                    }
                } else if (currentTestStep === 3 && waterMesh) {
                    // 1. Update falling water objects & check splash impacts
                    for (let i = objects.length - 1; i >= 0; i--) {
                        const drop = objects[i];
                        drop.position.y += drop.userData.vy;

                        if (!drop.userData.splashed && drop.position.y <= -1.8) {
                            drop.userData.splashed = true;
                            createSplash(drop.position.x, drop.position.z);
                            scene.remove(drop);
                            objects.splice(i, 1);
                        }
                    }

                    // 2. Animate splash particles physics
                    for (let i = splashParticles.length - 1; i >= 0; i--) {
                        const sp = splashParticles[i];
                        sp.mesh.position.x += sp.vx;
                        sp.mesh.position.y += sp.vy;
                        sp.mesh.position.z += sp.vz;
                        sp.vy -= 0.02; // Gravity
                        sp.life -= 0.03;
                        sp.mesh.material.opacity = sp.life;

                        if (sp.life <= 0 || sp.mesh.position.y < -3) {
                            scene.remove(sp.mesh);
                            splashParticles.splice(i, 1);
                        }
                    }

                    // 3. Dynamic Wave Height-Field Simulation Physics
                    const pos = waterGeometry.attributes.position.array;
                    const gridDim = 61;
                    const c = 0.22; // Wave propagation velocity
                    const damping = 0.96; // Wave energy damping

                    for (let x = 1; x < gridDim - 1; x++) {
                        for (let z = 1; z < gridDim - 1; z++) {
                            const idx = z * gridDim + x;
                            const neighborAvg = (
                                waterHeights[(z - 1) * gridDim + x] +
                                waterHeights[(z + 1) * gridDim + x] +
                                waterHeights[z * gridDim + (x - 1)] +
                                waterHeights[z * gridDim + (x + 1)]
                            ) * 0.25;

                            waterVelocities[idx] += (neighborAvg - waterHeights[idx]) * c;
                            waterVelocities[idx] *= damping;
                        }
                    }

                    for (let i = 0; i < pos.length / 3; i++) {
                        waterHeights[i] += waterVelocities[i];
                        pos[i * 3 + 1] = waterHeights[i];
                    }
                    waterGeometry.attributes.position.needsUpdate = true;
                    waterGeometry.computeVertexNormals();

                    // Update environment reflection map
                    waterMesh.visible = false;
                    waterCubeCamera.position.copy(waterMesh.position);
                    waterCubeCamera.update(renderer, scene);
                    waterMesh.visible = true;

                } else if (currentTestStep === 5 && particleGeom) {
                    const pos = particleGeom.attributes.position.array;
                    const count = particleGeom.drawRange.count;
                    for (let i = 0; i < count; i++) {
                        pos[i * 3] += particleVelocities[i * 3];
                        pos[i * 3 + 1] += particleVelocities[i * 3 + 1];
                        pos[i * 3 + 2] += particleVelocities[i * 3 + 2];

                        if (Math.abs(pos[i * 3]) > 20) particleVelocities[i * 3] *= -1;
                        if (Math.abs(pos[i * 3 + 1]) > 20) particleVelocities[i * 3 + 1] *= -1;
                        if (Math.abs(pos[i * 3 + 2]) > 20) particleVelocities[i * 3 + 2] *= -1;
                    }
                    particleGeom.attributes.position.needsUpdate = true;
                }

                scene.rotation.y += 0.002;
                renderer.render(scene, camera);
            }

            btnStart.addEventListener('click', () => {
                if (isTesting) stopTest();
                else startTestSequence();
            });

            btnRestart.addEventListener('click', () => {
                resultModal.classList.add('hidden');
                startTestSequence();
            });

            initThree();
            animate();
        };
    </script>
</body>
</html>
